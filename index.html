<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>明達館 座位表</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:-apple-system,"PingFang TC","Helvetica Neue",sans-serif; background:#F0EDE8; color:#1a1a1a; padding:10px; font-size:12px; }
h1 { font-size:16px; letter-spacing:2px; text-align:center; margin-bottom:2px; }
.sub { text-align:center; font-size:10px; color:#999; letter-spacing:1px; margin-bottom:8px; }
.toolbar { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin-bottom:8px; }
.btn { background:#1a1a1a; color:#fff; border:none; padding:7px 12px; border-radius:5px; font-size:11px; cursor:pointer; }
.btn.ghost { background:#fff; color:#1a1a1a; border:1px solid #bbb; }
.toggle-group { display:flex; border:1px solid #1a1a1a; border-radius:6px; overflow:hidden; }
.toggle-group button { border:none; background:#fff; color:#1a1a1a; padding:7px 12px; font-size:11px; cursor:pointer; }
.toggle-group button.active { background:#1a1a1a; color:#fff; }
.toggle-group button:not(:last-child) { border-right:1px solid #1a1a1a; }
.stat { text-align:center; font-size:11px; color:#666; margin-bottom:4px; }
.stat b { color:#1a1a1a; }
.cap-warn { text-align:center; font-size:11px; color:#b8341a; font-weight:700; margin-bottom:6px; display:none; }
.legend { display:flex; gap:14px; justify-content:center; margin-bottom:8px; flex-wrap:wrap; }
.leg { display:flex; align-items:center; gap:4px; font-size:10px; color:#555; }
.leg-box { width:12px; height:12px; border-radius:3px; border:1px solid #ccc; }
.save-status { text-align:center; font-size:10px; color:#999; margin-bottom:6px; height:14px; }
.save-status.saving { color:#c8860a; }
.save-status.saved { color:#2d8a3e; }
.save-status.error { color:#c0392b; }

.venue-wrap-outer { max-width:1450px; margin:0 auto; overflow-x:auto; display:flex; justify-content:center; }
.venue-wrap { width:728px; flex-shrink:0; background:#fff; border-radius:10px; padding:14px; box-shadow:0 2px 12px rgba(0,0,0,.08); transform:scale(1.25); transform-origin:top center; margin-bottom:232px; }
.screen-bar-abs { position:absolute; text-align:center; font-size:10px; background:#1a1a1a; color:#fff; border-radius:6px; padding:7px; letter-spacing:4px; }
.center-zone { position:absolute; display:flex; flex-direction:column; gap:8px; align-items:center; }
.stage-panel { width:100%; height:75px; background:#E8E8E8; border:2px solid #1a1a1a; border-radius:4px; display:flex; align-items:center; justify-content:center; font-size:10px; color:#666; letter-spacing:1px; text-align:center; line-height:1.6; }
.maintable-box { border:2px solid #B8944A; background:#FBF5E6; border-radius:8px; padding:8px 14px; display:flex; align-items:center; gap:8px; justify-content:center; }
.maintable-box .m-label { font-size:10px; font-weight:700; color:#9a7a30; letter-spacing:2px; }

.floor-plan { position:relative; width:700px; height:900px; margin:0 auto; background:#FCFBF8; overflow:visible; }
.room-boundary { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }
.deco-abs { position:absolute; font-size:9px; text-align:center; color:#888; border:1.5px dashed #ccc; border-radius:6px; padding:5px 4px; letter-spacing:1px; background:#fff; }
.pillar-box { position:absolute; width:50px; height:50px; background:#8a8a8a; border-radius:2px; opacity:.8; }
.counter-box { position:absolute; width:70px; background:linear-gradient(135deg,#E8C9A0,#D8AE78); border:1px solid #b8905a; border-radius:20px 100px 100px 20px; display:flex; align-items:center; justify-content:center; }
.counter-box span { writing-mode:vertical-rl; font-size:10px; color:#5a3d1a; font-weight:700; letter-spacing:2px; }
.counter-box.horizontal { border-radius:16px; }
.counter-box.horizontal span { writing-mode:horizontal-tb; letter-spacing:1px; }
.arrow-note { position:absolute; font-size:9px; color:#c0392b; font-weight:700; text-align:center; z-index:2; }
.aisle-path { position:absolute; border-left:1px dashed #ddd; border-right:1px dashed #ddd; }
.round-slot { position:absolute; }
.long-slot { position:absolute; }

/* 圓桌 5位：獨立wrapper容納座位環繞在桌子外圍 */
.round-wrap { position:relative; width:130px; height:130px; margin:0 auto; }
.round-table { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:44px; height:44px; border-radius:50%; border:1.5px solid #888; background:#FAFAFA; }
.round-table .table-mid { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:9px; font-weight:700; color:#666; cursor:pointer; white-space:nowrap; background:#fff; padding:1px 3px; border-radius:8px; border:1px solid #ccc; }
.round-wrap .r-seat { position:absolute; width:44px; transform:translate(-50%,-50%); }
.round-wrap .r-seat.p0 { left:65px; top:27px; }
.round-wrap .r-seat.p1 { left:101px; top:54px; }
.round-wrap .r-seat.p2 { left:87px; top:96px; }
.round-wrap .r-seat.p3 { left:43px;  top:96px; }
.round-wrap .r-seat.p4 { left:29px;  top:54px; }
.round-wrap .r-seat .seat { font-size:8px; padding:2px 1px; }
.round-wrap .r-seat .dish-select { font-size:8px; padding:1px 0; }

/* 長桌 16/20位（直式）：座位分左右兩欄夾住中間直向桌面 */
.long-table-v { display:flex; flex-direction:row; border:1.5px solid #5A8A52; border-radius:8px; background:#F2FAF0; min-height:100%; }
.long-table-v .lv-col { display:flex; flex-direction:column; padding:6px 3px; flex:1; justify-content:space-between; }
.long-table-v .table-bar-v { width:16px; background:#5A8A52; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.long-table-v .table-bar-v span { writing-mode:vertical-rl; font-size:9px; color:#fff; letter-spacing:2px; font-weight:700; cursor:pointer; }
.long-table-v .lv-seat { width:100%; }
.long-table-v .lv-seat .seat { font-size:8px; padding:2px 2px; }
.long-table-v .lv-seat .dish-select { font-size:8px; padding:1px 0; }
.long-table-v .lv-aisle-gap { height:16px; margin:2px 0; border-top:1px dashed #B8944A; border-bottom:1px dashed #B8944A; position:relative; flex-shrink:0; }
.long-table-v .lv-aisle-gap::after { content:'走道'; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:7px; color:#B8944A; background:#F2FAF0; padding:0 3px; white-space:nowrap; }

.seat-cell { display:flex; flex-direction:column; gap:2px; }
.seat { font-size:11px; background:#F0F0F0; border-radius:3px; padding:3px 4px; cursor:text; white-space:nowrap; overflow:hidden; line-height:1.4; border:1px solid transparent; outline:none; width:100%; box-sizing:border-box; font-family:inherit; text-align:center; }
.seat:hover { background:#E8E4DC; }
.seat.empty-s { color:#bbb; }
.seat.filled { background:#EDEDED; color:#1a1a1a; }
.seat.veg-pure { background:#A9DB9A; color:#1a4a15; }
.seat.veg-ovo { background:#D4EDCC; color:#2d6a21; }
.seat.veg-pure.kid { background:linear-gradient(135deg,#A9DB9A 50%,#CFE3F5 50%); color:#1a1a1a; }
.seat.veg-ovo.kid { background:linear-gradient(135deg,#D4EDCC 50%,#CFE3F5 50%); color:#1a1a1a; }
.seat.kid { background:#CFE3F5; color:#1a4a7a; }
.dish-select { font-size:8px; padding:2px 1px; border:1px solid #ddd; border-radius:3px; width:100%; background:#fff; }
.dish-print-text { display:none; }
@media print {
  .dish-select { display:none !important; }
  .dish-print-text { display:block; font-size:8px; text-align:center; padding:2px 0; }
}

.annex-block-outer { max-width:1450px; margin:10px auto 0; overflow-x:auto; display:flex; justify-content:center; }
.annex-block { width:728px; flex-shrink:0; background:#fff; border-radius:10px; padding:12px; box-shadow:0 2px 12px rgba(0,0,0,.08); display:none; transform:scale(1.25); transform-origin:top center; }
.annex-title { font-size:11px; font-weight:700; color:#1a1a1a; margin-bottom:8px; text-align:center; letter-spacing:1px; }
.annex-tables { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }

@media print {
  body { background:#fff; padding:0; }
  .toolbar, .save-status, .cap-warn, .stat, .legend { display:none !important; }
  .print-block { break-inside:avoid; page-break-inside:avoid; }
  .venue-wrap, .annex-block { box-shadow:none; transform:scale(1.05); transform-origin:top center; margin-bottom:0; }
  @page { size:A4 portrait; margin:6mm; }
  .venue-wrap-outer, .annex-block-outer { max-width:none; overflow:visible; }
  body { padding:0; }
}
@media (max-width:640px) {
  .venue-wrap { overflow-x:auto; }
}
</style>
</head>
<body>

<div class="print-block">
<h1>婚宴座位表</h1>
<div class="sub">MD創作料理 台大明達館</div>
<div class="sub" id="orderInfo" style="font-size:13px;font-weight:700;color:#1a1a1a;margin-top:2px;">載入中…</div>

<div class="toolbar">
  <div class="toggle-group" id="layoutToggle">
    <button data-v="stage" data-independent="1">舞台</button>
    <button data-v="maintable" data-independent="1">雙人主桌</button>
  </div>
  <div class="toggle-group" id="formatToggle">
    <button data-v="set">套餐</button>
    <button data-v="buffet">自助餐</button>
  </div>
  <div class="toggle-group" id="aisleToggle">
    <button data-v="no">無分隔</button>
    <button data-v="yes">分隔（留走道）</button>
  </div>
  <button class="btn ghost" onclick="openPrintWindow()">🖨️ 列印</button>
</div>

<div class="stat">已安排 <b id="seatedCount">0</b> / <span id="capLabel">75</span> 人（含加開包廂：<b id="annexCount">0</b>）</div>
<div class="stat" id="kidCheck"></div>
<div class="cap-warn" id="capWarn">⚠️ 已超過人數上限，請確認是否需調整方案</div>

<div class="legend">
  <div class="leg"><span class="leg-box" style="background:#A9DB9A"></span>全素</div>
  <div class="leg"><span class="leg-box" style="background:#D4EDCC"></span>蛋奶素</div>
  <div class="leg"><span class="leg-box" style="background:#CFE3F5"></span>兒童椅（右鍵標記）</div>
  <div class="leg">兒童餐／兒童共餐（僅限兒童）：套餐從主餐選單選</div>
  <div class="leg"><span class="leg-box" style="background:#EDEDED"></span>已填寫</div>
</div>
<div class="save-status" id="saveStatus"></div>

<div class="venue-wrap-outer"><div class="venue-wrap">
  <div class="floor-plan" id="floorPlan">
    <svg class="room-boundary" viewBox="0 0 700 870" preserveAspectRatio="none">
      <circle cx="350" cy="380" r="352" fill="none" stroke="#ccc" stroke-width="2" stroke-dasharray="6,5"/>
    </svg>

    <div class="screen-bar-abs" style="left:180px; top:20px; width:340px;">200 吋 投影幕</div>
    <div class="center-zone" id="centerZone" style="left:230px; top:50px; width:240px;"></div>

    <div class="deco-abs" style="left:64px; top:138px; width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center;">🎹<br>鋼琴</div>
    <div class="deco-abs" style="left:567px; top:139px; width:64px; background:#E8F2E4; border-color:#5A8A52; color:#3d6636;">音控區</div>

    <!-- 四根柱子：前後左右對稱（前後柱同一垂直線） -->
    <div class="pillar-box" style="left:195px; top:145px;"></div>
    <div class="pillar-box" style="left:545px; top:145px;"></div>
    <div class="pillar-box" id="pillarBackLeft" style="left:195px; top:520px;"></div>
    <div class="pillar-box" id="pillarBackRight" style="left:545px; top:575px;"></div>

    <div class="round-slot" id="rSlot0" style="left:55px; top:170px;"></div>
    <div class="round-slot" id="rSlot1" style="left:15px; top:320px;"></div>
    <div class="round-slot" id="rSlot2" style="left:55px; top:460px;"></div>
    <div class="round-slot" id="rSlot3" style="left:140px; top:555px;"></div>

    <div class="long-slot" id="lSlot0" style="left:185px; top:205px; width:100px; height:310px;"></div>
    <div class="long-slot" id="lSlot1" style="left:300px; top:205px; width:100px; height:388px;"></div>
    <div class="long-slot" id="lSlot2" style="left:440px; top:205px; width:100px; height:388px;"></div>

    <svg class="counter-arc" viewBox="0 0 700 870" style="position:absolute; left:0; top:0; width:700px; height:870px; pointer-events:none;">
      <defs>
        <linearGradient id="counterGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#E8C9A0"/>
          <stop offset="100%" stop-color="#D8AE78"/>
        </linearGradient>
      </defs>
      <path d="M 609 192 A 320 320 0 0 1 615 559 L 578 534 A 275 275 0 0 0 572 218 Z" fill="url(#counterGrad)" stroke="#b8905a" stroke-width="1.5"/>
    </svg>
    <div class="counter-label" id="counterBox" style="position:absolute; left:565px; top:355px; width:50px; text-align:center;">
      <span style="writing-mode:vertical-rl; font-size:10px; color:#5a3d1a; font-weight:700; letter-spacing:2px;">備 餐 檯 ／ 迎 賓 飲 料</span>
    </div>
    <div class="counter-box horizontal" id="welcomeDrinkBox" style="left:300px; top:620px; width:100px; height:80px; display:none;">
      <span>迎賓飲料</span>
    </div>

    <div class="aisle-path" style="left:405px; top:210px; width:35px; height:610px;"></div>
    <div class="arrow-note" style="left:390px; top:790px; width:65px;">↑<br>進場動線</div>
  </div>
</div></div>
</div>

<div class="annex-block-outer"><div class="annex-block" id="annexBlock">
  <div class="annex-title">海洋包廂加開（自助餐限定，最多加開20人）</div>
  <div class="annex-tables" id="annexTables"></div>
</div></div>

<script>
document.addEventListener('DOMContentLoaded', function () {

  // ── GAS 串接（沿用共用後端，venue無關）──────────────────
  var GAS_MODE = true;
  var BASE_URL = 'https://script.google.com/macros/s/AKfycbwV3pXKiwOBCbvv_W0ysv1_mjGsAnK4VqKQI5-jAbjDWGgEaBpVJufiszaVhYsc73Lg/exec';
  var TOKEN = (function(){
    var m = location.search.match(/[?&]token=([^&]+)/);
    return m ? decodeURIComponent(m[1]) : null;
  })();

  function setStatus(cls, msg) {
    var el = document.getElementById('saveStatus');
    el.className = 'save-status ' + cls; el.textContent = msg;
  }
  function timeStr() {
    var d=new Date(); return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');
  }

  var saveTimer = null;
  var LOADED = false;   // 後端資料載入成功前，一律不存檔（避免空白表蓋掉雲端資料）
  function scheduleSave() {
    if (!GAS_MODE || !TOKEN || !LOADED) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(doSave, 1200);
  }
  function doSave() {
    if (!TOKEN || !LOADED) return;
    setStatus('saving', '儲存中…');
    var payload = { showStage: state.showStage, showMainTable: state.showMainTable, format: state.format, aisle: state.aisle, tables: tables, annex: annexTables, mainSeats: state.mainSeats || null };
    var seatStr = JSON.stringify(payload);
    var getUrl = BASE_URL + '?action=saveSeatData&token=' + encodeURIComponent(TOKEN) + '&seat=' + encodeURIComponent(seatStr);
    if (getUrl.length <= 2000) {
      fetch(getUrl)
        .then(function(r){ return r.json(); })
        .then(function(res){
          if (res && res.success === false) setStatus('error', '⚠️ 未儲存：' + (res.error || '後端拒絕') + '，請重新整理頁面');
          else setStatus('saved', '✓ 已儲存 ' + timeStr());
        })
        .catch(function(e){ setStatus('error', '儲存失敗：' + e.message); });
    } else {
      fetch(BASE_URL, {
        method: 'POST', mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ token: TOKEN, action: 'saveSeatData', seat: payload })
      })
      .then(function(){ setStatus('saved', '✓ 已儲存 ' + timeStr()); })
      .catch(function(e){ setStatus('error', '儲存失敗：' + e.message); });
    }
  }

  // ── 資料模型 ──────────────────────────────────
  var state = { showStage: true, showMainTable: true, format: 'set', aisle: 'no' };
  var ORDER = {};
  var FORM = {};
  var TABLE_LABEL_MODE = 'number'; // 'number' 或 'letter'，依確認單「桌牌」選擇決定
  var seq = 0;
  var tables = [];       // 主場地固定桌
  var annexTables = [];  // 海洋包廂加開桌

  function mkSeats(n) {
    var a = [];
    for (var i = 0; i < n; i++) a.push({ name: '', dish: '', vegType: '', kid: false });
    return a;
  }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function get(id) { return tables.filter(function(t){ return t.id===id; })[0] || annexTables.filter(function(t){ return t.id===id; })[0]; }

  function addTable(list, type, label, n, key) {
    var t = { id: ++seq, type: type, label: label, key: key || label, autoLabel: true, seats: mkSeats(n) };
    list.push(t);
    return t;
  }

  function tableLabel(n) {
    if (TABLE_LABEL_MODE === 'letter') return String.fromCharCode(64 + n) + '桌'; // 1→A桌, 2→B桌...
    return n + '桌';
  }

  var TABLE_INDEX = { table1:1, table2:2, table3:3, table4:4, table5:5, table6:6, table7:7 };

  function computeDisplayLabel(t) {
    if (t.customLabel) return t.label;
    var idx = TABLE_INDEX[t.key];
    if (!idx) return t.label; // 非主場地桌（如海洋包廂）維持原標籤
    if (state.format === 'buffet' && idx > 4) idx = idx - 1; // 4桌隱藏後，5/6/7桌依序遞補為4/5/6
    return tableLabel(idx);
  }

  function seed() {
    for (var i=1;i<=4;i++) addTable(tables, 'round5', tableLabel(i), 5, 'table'+i);
    addTable(tables, 'long16', tableLabel(5), 16, 'table5');
    addTable(tables, 'long20', tableLabel(6), 20, 'table6');
    addTable(tables, 'long20', tableLabel(7), 20, 'table7');
    render();
  }

  function seedAnnex() {
    annexTables = [];
    for (var i=1;i<=4;i++) addTable(annexTables, 'round5', '包廂'+i+'桌', 5);
  }

  // ── IME安全輸入 + 標籤選單 ──────────────────────
  function makeSeatCell(t, idx) {
    var s = t.seats[idx];
    var wrap = document.createElement('div');
    wrap.className = 'seat-cell';

    var inp = document.createElement('input');
    inp.type = 'text';
    inp.className = seatClass(s);
    inp.value = s.name.trim();
    inp.placeholder = '座' + (idx+1);
    var composing = false;
    inp.addEventListener('compositionstart', function(){ composing = true; });
    inp.addEventListener('compositionend', function(){ composing = false; });
    inp.onblur = function(){
      if (composing) return;
      s.name = inp.value.trim();
      inp.value = s.name;
      inp.className = seatClass(s);
      updateStat(); scheduleSave();
    };
    inp.onkeydown = function(e){ if(e.key==='Enter' && !composing) inp.blur(); };
    inp.oncontextmenu = function(e){ e.preventDefault(); e.stopPropagation(); showTagMenu(e, s, inp); };
    var pressTimer = null, touchX=0, touchY=0;
    inp.addEventListener('touchstart', function(e){
      touchX = e.touches[0].clientX; touchY = e.touches[0].clientY;
      pressTimer = setTimeout(function(){ showTagMenu({ clientX: touchX, clientY: touchY }, s, inp); }, 600);
    }, { passive:true });
    inp.addEventListener('touchend', function(){ clearTimeout(pressTimer); }, { passive:true });
    inp.addEventListener('touchmove', function(){ clearTimeout(pressTimer); }, { passive:true });
    wrap.appendChild(inp);

    if (state.format === 'set') {
      var sel = document.createElement('select');
      sel.className = 'dish-select';
      var nameA = (ORDER.mainDishA_short && ORDER.mainDishA_short.trim()) || '主餐A';
      var nameB = (ORDER.mainDishB_short && ORDER.mainDishB_short.trim()) || '主餐B';
      sel.innerHTML = '<option value="">主餐</option><option value="A">' + nameA + '</option><option value="B">' + nameB + '</option>' +
        '<option value="kidmeal">兒童餐</option><option value="share">兒童共餐（僅限兒童，不佔餐）</option>';
      sel.value = s.dish || '';
      var printText = document.createElement('div');
      printText.className = 'dish-print-text';
      function syncPrintText(){
        printText.textContent = sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].text : '';
      }
      syncPrintText();
      sel.onchange = function(){ s.dish = sel.value; syncPrintText(); updateStat(); scheduleSave(); };
      wrap.appendChild(sel);
      wrap.appendChild(printText);
    }
    return wrap;
  }

  function seatClass(s) {
    var vegCls = s.vegType === '全素' ? ' veg-pure' : s.vegType === '蛋奶素' ? ' veg-ovo' : '';
    return 'seat' + (!s.name.trim() ? ' empty-s' : (vegCls && s.kid) ? vegCls + ' kid' : vegCls ? vegCls : s.kid ? ' kid' : ' filled');
  }

  function refreshSeat(inp, s) {
    inp.value = s.name;
    inp.className = seatClass(s);
    updateStat(); scheduleSave();
  }

  function makeMid(t) {

  function makeLongTableVertical(t) {
    var n = t.seats.length; // 16 or 20
    if (t.key === 'table7' && state.format === 'buffet') n = 18; // 自助餐格式：備餐台前2位不開放
    var half = n/2;
    var div = document.createElement('div');
    div.className = 'long-table-v';
    var colL = document.createElement('div'); colL.className = 'lv-col';
    var bar = document.createElement('div'); bar.className = 'table-bar-v';
    var barSpan = document.createElement('span'); barSpan.textContent = computeDisplayLabel(t);
    barSpan.title = '點擊改桌名';
    barSpan.onclick = function(e){
      e.stopPropagation();
      var v = prompt('桌名', computeDisplayLabel(t));
      if (v !== null && v.trim()) { t.label = v.trim(); t.customLabel = true; render(); scheduleSave(); }
    };
    bar.appendChild(barSpan);
    var colR = document.createElement('div'); colR.className = 'lv-col';
    var GAP_EVERY = 3; // 分隔版：每 3 個位子後留走道空隙（若分隔後剩不到 2 人則不留，避免孤立小尾段）
    for (var i=0;i<half;i++) {
      var c = document.createElement('div'); c.className='lv-seat'; c.appendChild(makeSeatCell(t, i)); colL.appendChild(c);
      if (state.aisle === 'yes' && (i+1) % GAP_EVERY === 0 && (half - (i+1)) >= 2) {
        var gapL = document.createElement('div'); gapL.className = 'lv-aisle-gap';
        colL.appendChild(gapL);
      }
    }
    var seatNoInCol = 0;
    for (var i=half;i<n;i++) {
      seatNoInCol++;
      var c2 = document.createElement('div'); c2.className='lv-seat'; c2.appendChild(makeSeatCell(t, i)); colR.appendChild(c2);
      if (state.aisle === 'yes' && seatNoInCol % GAP_EVERY === 0 && (n - (i+1)) >= 2) {
        var gapR = document.createElement('div'); gapR.className = 'lv-aisle-gap';
        colR.appendChild(gapR);
      }
    }
    div.appendChild(colL);
    div.appendChild(bar);
    div.appendChild(colR);
    return div;
  }

  // 依實際渲染出來的桌子高度，動態往下排後排柱子、4桌、走道位置，避免手動座標跟內容高度對不上而互相蓋住
  function layoutAdjust() {
    var mainIds = ['lSlot0','lSlot1','lSlot2','rSlot0','rSlot1','rSlot2'];
    var maxBottom = 0;
    mainIds.forEach(function(id){
      var el = document.getElementById(id);
      if (el && el.offsetHeight > 0) {
        var bottom = el.offsetTop + el.offsetHeight;
        if (bottom > maxBottom) maxBottom = bottom;
      }
    });
    var gap = 20;
    var pillarTop = maxBottom + gap;
    var pillarBL = document.getElementById('pillarBackLeft');
    var pillarBR = document.getElementById('pillarBackRight');
    if (pillarBL) pillarBL.style.top = pillarTop + 'px';
    if (pillarBR) pillarBR.style.top = pillarTop + 'px';

    var table4Top = pillarTop + 25;
    var rSlot3 = document.getElementById('rSlot3');
    if (rSlot3) { rSlot3.style.top = table4Top + 'px'; rSlot3.style.left = '100px'; }

    var table4Bottom = table4Top + 130; // 130 = 圓桌wrapper高度
    var aisleTop = Math.max(210, maxBottom + gap);
    var floorBottom = Math.max(table4Bottom, pillarTop + 50) + gap + 100; // 進場動線走道最少再留100px

    var aisle = document.querySelector('.aisle-path');
    var arrow = document.querySelector('.arrow-note');
    if (aisle) { aisle.style.top = aisleTop + 'px'; aisle.style.height = (floorBottom - aisleTop) + 'px'; }
    if (arrow) { arrow.style.top = (floorBottom - 40) + 'px'; }

    var floorPlan = document.getElementById('floorPlan');
    if (floorPlan) {
      var neededHeight = floorBottom + 40;
      floorPlan.style.height = Math.max(900, neededHeight) + 'px';
      var venueWrap = document.querySelector('.venue-wrap');
      if (venueWrap) {
        var extra = Math.max(0, neededHeight - 900);
        venueWrap.style.marginBottom = (232 + extra) + 'px';
      }
    }
  }

  function countFilled(list) {
    var c = 0;
    list.forEach(function(t){ t.seats.forEach(function(s){ if (s.name.trim()) c++; }); });
    return c;
  }

  function updateStat() {
    var main = countFilled(tables.filter(function(t){ return !(t.key === 'table4' && state.format === 'buffet'); }));
    if (state.showMainTable && state.mainSeats) {
      state.mainSeats.forEach(function(s){ if (s.name.trim()) main++; });
    }
    var annex = state.format === 'buffet' ? countFilled(annexTables) : 0;
    document.getElementById('seatedCount').textContent = main;
    document.getElementById('annexCount').textContent = annex;
    var cap = state.format === 'set' ? 75 : 70;
    if (state.format === 'set') main -= countShare();
    renderKidCheck();
    document.getElementById('capLabel').textContent = cap + (state.format==='buffet' ? '（+包廂20）' : '（套餐）');
    var over = state.format === 'set' ? (main > cap) : (main > cap || annex > 20);
    document.getElementById('capWarn').style.display = over ? 'block' : 'none';
  }

  function allSeatsInUse() {
    var list = [];
    tables.forEach(function(t){
      if (t.key === 'table4' && state.format === 'buffet') return;
      var n = (t.key === 'table7' && state.format === 'buffet') ? 18 : t.seats.length;
      t.seats.slice(0, n).forEach(function(s){ list.push(s); });
    });
    if (state.showMainTable && state.mainSeats) state.mainSeats.forEach(function(s){ list.push(s); });
    if (state.format === 'buffet') annexTables.forEach(function(t){ t.seats.forEach(function(s){ list.push(s); }); });
    return list.filter(function(s){ return s.name && s.name.trim(); });
  }
  function countShare() {
    return allSeatsInUse().filter(function(s){ return s.dish === 'share'; }).length;
  }
  function renderKidCheck() {
    var el = document.getElementById('kidCheck'); if (!el) return;
    var seats = allSeatsInUse();
    var kidMeal = 0, chair = 0, share = 0, noDish = 0;
    seats.forEach(function(s){
      if (s.dish === 'kidmeal') kidMeal++;
      if (s.dish === 'share') share++;
      if (s.kid) chair++;
      if (state.format === 'set' && !s.dish && !s.vegType) noDish++;
    });
    function cmp(label, n, formVal) {
      var f = parseInt(formVal, 10);
      if (isNaN(f)) return label + ' <b>' + n + '</b>';
      var bad = f !== n;
      return '<span style="color:' + (bad ? '#c0392b' : '#2d8a3e') + '">' + label + ' <b>' + n + '</b>（確認單 ' + f + '）' + (bad ? ' ⚠️' : ' ✓') + '</span>';
    }
    var parts = [];
    if (state.format === 'set') parts.push(cmp('兒童餐', kidMeal, FORM.paxKidMeal));
    parts.push(cmp('兒童椅', chair, FORM.kidsChair));
    if (share) parts.push('兒童共餐 <b>' + share + '</b>');
    if (noDish) parts.push('<span style="color:#c8860a">未選主餐 <b>' + noDish + '</b></span>');
    el.innerHTML = parts.join('　');
  }

  function loadData() {
    if (!TOKEN) { updateOrderInfo(); seed(); setIndependentToggleUI('layoutToggle', state, LAYOUT_KEY_MAP); setToggleUI('formatToggle','set'); setToggleUI('aisleToggle','no'); return; }
    setStatus('saving', '載入中…');
    var lockEl = document.createElement('div');
    lockEl.id = 'loadLock';
    lockEl.style.cssText = 'position:fixed;inset:0;background:rgba(255,255,255,.75);z-index:300;display:flex;align-items:center;justify-content:center;font-size:15px;color:#555;';
    lockEl.textContent = '座位表載入中，請稍候…';
    document.body.appendChild(lockEl);

    fetch(BASE_URL + '?token=' + encodeURIComponent(TOKEN) + '&action=getSeatData')
      .then(function(r){ return r.json(); })
      .then(function(data){
        ORDER = (data && data.order) || {};
        FORM = (data && data.form) || {};
        TABLE_LABEL_MODE = (FORM.tableCard === '字母(A-J)') ? 'letter' : 'number';
        updateOrderInfo();
        if (ORDER.groomName) {
          document.title = (ORDER.weddingDate || '') + ' ' + ORDER.groomName + '&' + ORDER.brideName + '｜明達館座位表';
        }
        var seat = data && data.seat;
        if (seat && seat.tables && seat.tables.length) {
          tables = seat.tables;
          tables.forEach(function(t, i){ if (!t.key && i < 7) t.key = 'table' + (i+1); });
          annexTables = seat.annex || [];
          if (seat.mainSeats && seat.mainSeats.length) state.mainSeats = seat.mainSeats;
          if (seat.showStage !== undefined || seat.showMainTable !== undefined) {
            state.showStage = seat.showStage !== undefined ? seat.showStage : true;
            state.showMainTable = seat.showMainTable !== undefined ? seat.showMainTable : true;
          } else if (seat.layout) {
            // 向下相容舊資料（曾經是互斥的單一 layout 欄位）
            state.showStage = seat.layout === 'stage';
            state.showMainTable = seat.layout === 'maintable';
          }
          state.format = seat.format || 'set';
          state.aisle = seat.aisle || 'no';
          seq = 0;
          tables.concat(annexTables).forEach(function(t){ if (t.id > seq) seq = t.id; });
        } else if (data && data.order && data.order.menuFormat) {
          state.format = data.order.menuFormat === '自助餐' ? 'buffet' : 'set';
          seed();
        } else {
          seed();
        }
        setIndependentToggleUI('layoutToggle', state, LAYOUT_KEY_MAP);
        setToggleUI('formatToggle', state.format);
        setToggleUI('aisleToggle', state.aisle);
        render();
        setStatus('saved', '已載入');
        LOADED = true;
        lockEl.remove();
      })
      .catch(function(){
        setStatus('error', '載入失敗，請重新整理頁面（目前的修改不會被儲存）');
        lockEl.textContent = '⚠️ 載入失敗，請重新整理頁面';
        lockEl.style.color = '#c0392b';
      });
  }

  // ── 列印：A4 橫式專用版面（獨立視窗，不受畫面版樣式干擾）──
  var MD_COLOR = { '全素':'#1E6B2B', '蛋奶素':'#2E7D32', '兒童餐':'#1F5AA6', '兒童共餐':'#6B6B6B', '未選':'#999999' };
  var MAIN_COLORS = ['#C0392B', '#2874A6'];
  function escH(v) {
    return String(v == null ? '' : v).replace(/[&<>"]/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; });
  }
  function dishNames() {
    return {
      A: (ORDER.mainDishA_short && ORDER.mainDishA_short.trim()) || '主餐A',
      B: (ORDER.mainDishB_short && ORDER.mainDishB_short.trim()) || '主餐B'
    };
  }
  function seatMeal(s) {
    var dn = dishNames();
    if (s.vegType) return { tag: s.vegType, cat: s.vegType, color: MD_COLOR[s.vegType] };
    if (state.format !== 'set') return { tag: '', cat: '一般', color: '#555' };
    if (s.dish === 'A') return { tag: dn.A, cat: 'A', color: MAIN_COLORS[0] };
    if (s.dish === 'B') return { tag: dn.B, cat: 'B', color: MAIN_COLORS[1] };
    if (s.dish === 'kidmeal') return { tag: '兒童餐', cat: '兒童餐', color: MD_COLOR['兒童餐'] };
    if (s.dish === 'share') return { tag: '兒童共餐', cat: '兒童共餐', color: MD_COLOR['兒童共餐'] };
    if (state.format === 'set') return { tag: '未選主餐', cat: '未選', color: MD_COLOR['未選'] };
    return { tag: '', cat: '一般', color: '#555' };
  }
  function seatBg(s) { return s.vegType === '全素' ? ' vegp' : s.vegType ? ' veg' : s.kid ? ' kid' : ''; }
  function cellH(s) {
    if (!s) return '<div></div>';
    if (!s.name || !s.name.trim()) return '<div class="c ch empty"></div>';
    var m = seatMeal(s);
    return '<div class="c ch' + seatBg(s) + '"><span class="n">' + escH(s.name) + (s.kid && s.vegType ? '<i class="kc">椅</i>' : '') + '</span>' +
      (m.tag ? '<span class="d" style="color:' + m.color + '">' + escH(m.tag) + '</span>' : '') + '</div>';
  }
  function seatsOf(t) {
    var n = (t.key === 'table7' && state.format === 'buffet') ? 18 : t.seats.length;
    return t.seats.slice(0, n);
  }
  function filledN(seats) { return seats.filter(function(s){ return s.name && s.name.trim(); }).length; }
  function roundCard(t) {
    var seats = seatsOf(t);
    var rows = '';
    for (var i = 0; i < seats.length; i += 2) rows += cellH(seats[i]) + cellH(seats[i + 1]);
    return '<div class="card round"><div class="hd"><b>' + escH(computeDisplayLabel(t)) + '</b><span>' + filledN(seats) + '／' + seats.length + '人</span></div><div class="g2">' + rows + '</div></div>';
  }
  function longCard(t) {
    var seats = seatsOf(t);
    var half = seats.length / 2;
    function col(arr) {
      var out = '';
      arr.forEach(function(s, i){
        out += cellH(s);
        if (state.aisle === 'yes' && (i + 1) % 3 === 0 && (arr.length - (i + 1)) >= 2) out += '<div class="aisle">走道</div>';
      });
      return out;
    }
    return '<div class="card long"><div class="hd"><b>' + escH(computeDisplayLabel(t)) + '</b><span>' + filledN(seats) + '／' + seats.length + '人</span></div>' +
      '<table class="lt"><tr><td class="lc">' + col(seats.slice(0, half)) + '</td><td class="lbar">' + escH(computeDisplayLabel(t)) + '</td><td class="lc">' + col(seats.slice(half)) + '</td></tr></table></div>';
  }

  function buildPrintDoc(autoPrint) {
    var g = ORDER.groomName, b = ORDER.brideName, d = ORDER.weddingDate, s = ORDER.mealSession;
    var docTitle = (d || '') + ' ' + (g || '') + '&' + (b || '') + '｜明達館座位表';
    var isSet = state.format === 'set';
    var dn = dishNames();

    // ── 統計 ──
    var cats = isSet ? [['A', dn.A, MAIN_COLORS[0]], ['B', dn.B, MAIN_COLORS[1]], ['全素', '全素', MD_COLOR['全素']], ['蛋奶素', '蛋奶素', MD_COLOR['蛋奶素']], ['兒童餐', '兒童餐', MD_COLOR['兒童餐']], ['兒童共餐', '兒童共餐', MD_COLOR['兒童共餐']], ['未選', '未選', '#888']]
                     : [['一般', '一般', '#555'], ['全素', '全素', MD_COLOR['全素']], ['蛋奶素', '蛋奶素', MD_COLOR['蛋奶素']]];
    var groups = [];
    tables.forEach(function(t){ if (!(t.key === 'table4' && state.format === 'buffet')) groups.push({ label: computeDisplayLabel(t), seats: seatsOf(t) }); });
    if (state.showMainTable && state.mainSeats) groups.unshift({ label: '雙人主桌', seats: state.mainSeats });
    if (!isSet) annexTables.forEach(function(t){ groups.push({ label: t.label, seats: t.seats, annex: true }); });
    var total = { n: 0 }, chairs = 0, annexN = 0;
    var rowsData = groups.map(function(gp){
      var r = { label: gp.label, n: 0 };
      gp.seats.forEach(function(st){
        if (!st.name || !st.name.trim()) return;
        var c = seatMeal(st).cat;
        r.n++; r[c] = (r[c] || 0) + 1; total.n++; total[c] = (total[c] || 0) + 1;
        if (st.kid) chairs++;
        if (gp.annex) annexN++;
      });
      return r;
    }).filter(function(r){ return r.n; });
    cats = cats.filter(function(c){ return total[c[0]] || ['A','B','一般'].indexOf(c[0]) >= 0; });

    var mealN = total.n - (total['兒童共餐'] || 0);
    var cap = isSet ? 75 : 70;
    var mainHall = isSet ? mealN : total.n - annexN;
    var over = mainHall > cap || annexN > 20;
    var capText = isSet ? ('套餐 ' + mealN + '／上限 75 份') : ('主場 ' + mainHall + '／70・包廂 ' + annexN + '／20');
    var summary = cats.filter(function(c){ return total[c[0]]; }).map(function(c){ return c[1] + ' ' + total[c[0]]; }).join('・');

    var th = '<tr><th class="l">餐點統計</th><th>人數</th>' + cats.map(function(c){ return '<th style="background:' + c[2] + '">' + escH(c[1]) + '</th>'; }).join('') + '</tr>';
    var trs = rowsData.map(function(r){
      return '<tr><td class="l">' + escH(r.label) + '</td><td>' + r.n + '</td>' + cats.map(function(c){ return '<td>' + (r[c[0]] || '–') + '</td>'; }).join('') + '</tr>';
    }).join('');
    trs += '<tr class="tot"><td class="l">合計</td><td>' + total.n + '</td>' + cats.map(function(c){ return '<td>' + (total[c[0]] || '–') + '</td>'; }).join('') + '</tr>';

    // ── 第1頁：實際場圖（複製畫面上的場圖，輸入框換成文字＋餐點標籤）──
    var live = document.getElementById('floorPlan');
    var clone = live.cloneNode(true);
    clone.removeAttribute('id');
    var liveInputs = live.querySelectorAll('input.seat');
    clone.querySelectorAll('input.seat').forEach(function(inp, i){
      var li = liveInputs[i];
      var div = document.createElement('div');
      div.className = li.className + ' pseat';
      div.textContent = li.value.trim();
      inp.parentNode.replaceChild(div, inp);
    });
    var liveSels = live.querySelectorAll('select.dish-select');
    clone.querySelectorAll('select.dish-select').forEach(function(sel, i){
      var ls = liveSels[i];
      var cell = ls.closest('.seat-cell');
      var nameInp = cell ? cell.querySelector('input.seat') : null;
      var filled = nameInp && nameInp.value.trim();
      var veg = nameInp && /veg-pure/.test(nameInp.className) ? '全素' : (nameInp && /veg-ovo/.test(nameInp.className) ? '蛋奶素' : '');
      var m = seatMeal({ name: filled ? 'x' : '', dish: ls.value, vegType: veg, kid: false });
      var tag = document.createElement('div');
      tag.className = 'pdish';
      if (filled && m.tag) { tag.textContent = m.tag; tag.style.color = m.color; }
      sel.parentNode.replaceChild(tag, sel);
    });
    clone.querySelectorAll('.dish-print-text').forEach(function(el){ el.remove(); });
    clone.querySelectorAll('[onclick]').forEach(function(el){ el.removeAttribute('onclick'); });
    // 套餐時素食座位在畫面上沒有主餐選單，補上素食標籤
    if (!isSet) {
      clone.querySelectorAll('.pseat.veg-pure, .pseat.veg-ovo').forEach(function(el){
        if (!el.textContent) return;
        var t = document.createElement('div'); t.className = 'pdish';
        t.textContent = /veg-pure/.test(el.className) ? '全素' : '蛋奶素';
        t.style.color = MD_COLOR[t.textContent];
        el.parentNode.appendChild(t);
      });
    }
    var planH = live.offsetHeight;

    var annexHtml = (!isSet && annexTables.length)
      ? '<div class="sec">海洋包廂加開（最多 20 人）</div><div class="annex-g">' + annexTables.map(roundCard).join('') + '</div>' : '';

    var baseCss = document.querySelector('style').textContent;
    var css = baseCss +
      '@page{size:A4 portrait;margin:6mm}' +
      'html,body{background:#fff !important;padding:0 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}' +
      'body{font-family:-apple-system,"PingFang TC","Noto Sans TC","Helvetica Neue",sans-serif;color:#222}' +
      '.page{width:198mm;overflow:hidden}.page + .page{break-before:page;page-break-before:always}' +
      '.head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:.6mm solid #9D380E;padding-bottom:1.5mm;margin-bottom:2mm}' +
      '.ttl{font-size:14pt;font-weight:800;color:#9D380E;line-height:1.25}.ttl .cp{display:block;color:#222;font-size:13pt}.ttl .br{font-size:8pt;font-weight:600;color:#6BA1C7;margin-left:2mm}' +
      '.meta{font-size:7.5pt;color:#555;text-align:right;line-height:1.55}.meta b{font-size:12pt;color:#9D380E}.meta .over{color:#c0392b;font-weight:700}' +
      '.legend2{font-size:7pt;color:#555;display:flex;flex-wrap:wrap;gap:1mm 3mm;margin-bottom:1.5mm;justify-content:center}' +
      '.sw{display:inline-block;width:3mm;height:3mm;border-radius:.6mm;vertical-align:-.5mm;margin-right:.6mm;border:.2mm solid #999}' +
      '.planbox{display:flex;justify-content:center}' +
      '.planbox .floor-plan{margin:0;flex-shrink:0}' +
      '.pseat{font-size:9px !important;font-weight:700;min-height:15px;padding:2px 1px !important;border:1px solid #ddd !important;white-space:nowrap;overflow:hidden;text-overflow:clip}' +
      '.pseat.empty-s{background:#fafafa !important;border-style:dashed !important}' +
      '.pdish{font-size:8px;font-weight:700;text-align:center;line-height:1.3;min-height:10px}' +
      '.arrow-note{white-space:nowrap;width:auto !important;margin-left:-6px}' +
      '.sec{font-size:10pt;font-weight:700;color:#9D380E;border-left:1.2mm solid #9D380E;background:#F8EFEA;padding:1mm 2.5mm;margin:3mm 0 2mm}' +
      'table.st{width:100%;border-collapse:collapse;font-size:8.5pt}' +
      'table.st th{background:#9D380E;color:#fff;padding:1mm;font-weight:700}table.st th.l{background:#3a5f8a;text-align:left}' +
      'table.st td{border-bottom:.2mm solid #e5e0d8;padding:.9mm 1mm;text-align:center}table.st td.l{text-align:left}' +
      'table.st tr.tot td{background:#F6E6DE;font-weight:700;color:#9D380E}' +
      '.annex-g{display:grid;grid-template-columns:repeat(2,1fr);gap:2mm}' +
      '.card{border:.3mm solid #D4A017;border-radius:2mm;padding:1.2mm 1.5mm;background:#FFFBEF}' +
      '.card .hd{display:flex;justify-content:space-between;font-size:8.5pt;color:#8a5e00;margin-bottom:.8mm}.card .hd span{color:#888;font-size:7.5pt}' +
      '.g2{display:grid;grid-template-columns:1fr 1fr;gap:.8mm 1.2mm}' +
      '.c{border:.25mm solid #D5CFC6;border-radius:1mm;background:#fff}' +
      '.ch{min-height:6mm;display:flex;justify-content:space-between;align-items:center;padding:.3mm 1.2mm;gap:1mm}' +
      '.ch .n{font-size:8pt;font-weight:700}.ch .d{font-size:7pt;font-weight:700}.kc{font-style:normal;font-size:6pt;color:#1F5AA6;margin-left:.6mm}' +
      '.c.vegp{background:#C9E8BE}.c.veg{background:#DDF0D6}.c.kid{background:#DCE9F8}.c.empty{border-style:dashed;background:#FAFAFA}';

    var headHtml = '<div class="head"><div class="ttl">' + escH((d || '') + (s ? ' ' + s : '')) + '　MD創作料理 台大明達館 座位表' +
        '<span class="br">wedding fun 想樂</span><span class="cp">' + escH((g || '') + ' & ' + (b || '')) + '</span></div>' +
        '<div class="meta">賓客 <b>' + total.n + '</b> 人｜' + escH(summary) + '<br>兒童椅 ' + chairs + ' 張｜' +
        '<span class="' + (over ? 'over' : '') + '">' + (over ? '⚠️ ' : '') + capText + '</span><br>' + (isSet ? '套餐' : '自助餐') + (state.aisle === 'yes' ? '・長桌分隔留走道' : '') + '</div></div>';
    var legendHtml = '<div class="legend2">' +
      cats.filter(function(c){ return c[0] !== '未選' && c[0] !== '一般'; }).map(function(c){ return '<span style="color:' + c[2] + ';font-weight:700">■' + escH(c[1]) + '</span>'; }).join('') +
      '<span><i class="sw" style="background:#A9DB9A"></i>全素</span><span><i class="sw" style="background:#D4EDCC"></i>蛋奶素</span><span><i class="sw" style="background:#CFE3F5"></i>坐兒童椅</span>' +
      (isSet ? '<span>兒童共餐＝僅限兒童，不計入套餐份數</span>' : '') + '</div>';

    var body = '<div class="page" id="p1">' + headHtml + legendHtml + '<div class="planbox" id="planbox">' + clone.outerHTML + '</div></div>' +
      '<div class="page" id="p2">' + headHtml + '<div class="sec">餐點統計</div><table class="st">' + th + trs + '</table>' + annexHtml + '</div>';
    var fit = '<script>window.addEventListener("load",function(){' +
      'var px=96/25.4,p1=document.getElementById("p1"),pb=document.getElementById("planbox"),fp=pb.querySelector(".floor-plan");' +
      'var availH=283*px-(p1.scrollHeight-pb.scrollHeight),availW=198*px;' +
      'var sc=Math.min(1.15,availW/fp.offsetWidth,availH/fp.offsetHeight);fp.style.zoom=sc;' +
      (autoPrint ? 'setTimeout(function(){window.focus();window.print();},300);' : '') +
      '});<' + '/script>';

    return '<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><title>' + escH(docTitle) + '</title><style>' + css + '</style></head><body>' + body + fit + '</body></html>';
  }
  window.buildPrintDoc = buildPrintDoc;

  function openPrintWindow() {
    var win = window.open('', '_blank');
    if (!win) { alert('瀏覽器阻擋了列印視窗彈出，請允許本頁的彈出視窗後再試一次。'); return; }
    win.document.open();
    win.document.write(buildPrintDoc(true));
    win.document.close();
  }
  window.openPrintWindow = openPrintWindow;

  loadData();
});
</script>
</body>
</html>
